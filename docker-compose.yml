# ═══════════════════════════════════════
# DailyPlan Docker Compose（v12.0）
#
# 启动: docker compose up -d              # App + MySQL
# 生产: docker compose --profile production up -d   # 再加 Nginx
# 日志: docker compose logs -f app
#
# 变量从同目录 .env 读取（cp .env.example .env）。
# 带 :? 的变量缺失时 compose 会直接报错，拒绝以弱默认值启动。
# ═══════════════════════════════════════

services:
  # ── FastAPI 应用（含前端产物） ──
  app:
    build: .
    container_name: dailyplan-app
    restart: unless-stopped
    ports:
      - "5000:5000"   # 启用 nginx 后可删除此端口映射
    environment:
      - DP_ENV=production
      # 数据库（MySQL）
      - DP_DB_TYPE=mysql
      - DP_MYSQL_HOST=db
      - DP_MYSQL_PORT=3306
      - DP_MYSQL_USER=dailyplan
      - DP_MYSQL_PASSWORD=${DP_MYSQL_PASSWORD:?请在 .env 中设置 DP_MYSQL_PASSWORD}
      - DP_MYSQL_DB=dailyplan
      # 安全（JWT 签名 + 敏感配置加密密钥）
      - DP_SECRET_KEY=${DP_SECRET_KEY:?请在 .env 中设置 DP_SECRET_KEY（≥32 位随机串）}
      # 注册模式
      - DP_REGISTRATION_MODE=${DP_REGISTRATION_MODE:-invite_only}
      # AI（可选）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DP_AI_MODEL=${DP_AI_MODEL:-deepseek-chat}
      # 日志
      - DP_LOG_LEVEL=${DP_LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - appdata:/app/data   # 用户上传文件（头像）
    networks:
      - dailyplan-net

  # ── MySQL 8（2C2G 轻量服务器调优） ──
  db:
    image: mysql:8.0
    container_name: dailyplan-db
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --skip-log-bin
      - --max-connections=50
      - --table-open-cache=200
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=${DP_MYSQL_ROOT_PASSWORD:?请在 .env 中设置 DP_MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=dailyplan
      - MYSQL_USER=dailyplan
      - MYSQL_PASSWORD=${DP_MYSQL_PASSWORD:?请在 .env 中设置 DP_MYSQL_PASSWORD}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - dailyplan-net

  # ── Nginx 反向代理（production profile，可选） ──
  nginx:
    image: nginx:alpine
    container_name: dailyplan-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # HTTPS 证书（取消注释并放入证书后，同时启用 nginx.conf 中的 443 server）
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - dailyplan-net
    profiles:
      - production

volumes:
  mysqldata:
  appdata:

networks:
  dailyplan-net:
    driver: bridge
