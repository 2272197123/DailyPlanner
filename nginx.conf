# ═══════════════════════════════════════
# Nginx 反向代理（v12.0）
# 生产环境：TLS 终止 + gzip + 反代到 app:5000
# （前端 /assets/ 缓存头由 FastAPI 设置，nginx 透传）
# ═══════════════════════════════════════

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 基础优化
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # 日志
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;

        # 前端产物 /assets/ 由 app 服务并自带长缓存头，此处直接反代

        # API + 动态页面 — 不缓存
        location / {
            # 如果 Nginx 和 app 不在同一容器，改 proxy_pass 为 http://app:5000
            # 同容器部署时，Nginx 和 uvicorn 在同一网络
            proxy_pass http://app:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持（未来实时功能用）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时（AI 请求可能较慢）
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # 客户端最大上传（JSON 导入）
        client_max_body_size 5m;
    }

    # ── HTTPS server（取消注释并挂载证书后启用） ──
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     location / {
    #         proxy_pass http://app:5000;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #         proxy_read_timeout 120s;
    #     }
    #
